<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Anrufen Online</title>
<link rel="stylesheet" href="style.css?v=11160954">
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">Yükleniyor…</div>
<div id="rotate" class="hidden"><div>Lütfen telefonunu yatay çevir</div></div>

<div id="panel" class="hidden">
  <div class="frame">
    <div class="phead"><span id="ptitle"></span><button id="pclose" aria-label="Kapat">✕</button></div>
    <div id="pbody"></div>
  </div>
</div>

<div id="dlg" class="hidden">
  <div class="dframe">
    <div id="dname"></div>
    <div id="dtext"></div>
    <div id="dbtns"></div>
  </div>
</div>

<!-- Giriş ekranı: orijinal ana menü (logo, kitap, oklarla seçilen menü sözcüğü) ve kullanıcı girişi. 360 yüksekliğinde mantıksal alan ekrana ölçeklenir. -->
<div id="title" class="cover hidden"><div class="cv">
  <img class="clogo" src="assets/ui/UIData_2067.png" alt="Anrufen Online">
  <button class="carr l" id="tprev" aria-label="Önceki"></button><div id="tword"></div><button class="carr r" id="tnext" aria-label="Sonraki"></button>
  <button id="tbook" aria-label="Seç"></button>
  <p id="tinfo" class="cinfo"></p><span class="ver">Sürüm 11160954</span>
</div></div>
<div id="online" class="cover hidden"><div class="cv">
  <div class="cframe">
    <div id="ologin" class="cform">
      <label><span>Sunucu</span><input id="ourl" placeholder="https://…" autocomplete="url" inputmode="url"></label>
      <label><span>Kullanıcı adı</span><input id="ouser" maxlength="24" autocomplete="username" autocapitalize="off"></label>
      <label><span id="opassl">Şifre</span><input id="opass" type="password" maxlength="100" autocomplete="current-password"></label>
      <label id="onewrow" class="hidden"><span>Yeni şifre</span><input id="onewp" type="password" maxlength="100" autocomplete="new-password"></label>
      <div class="crow"><button id="osave" class="chk on" aria-label="Kaydet"></button><span class="clab" id="osavel">Kaydet</span><button id="ogo" class="cbtn">Giriş</button></div>
    </div>
    <div id="ochars" class="hidden"><div class="ctit2">Karakter Seç</div><div id="olist"></div></div>
    <p id="omsg" class="cinfo"></p>
  </div>
  <div class="cbtns"><button id="oreg" class="cbtn">Kayıt Ol</button><button id="ochg" class="cbtn">Değiştir</button><button id="onew" class="cbtn hidden">Yeni Karakter</button><button id="oout" class="cbtn hidden">Çıkış Yap</button><button id="oback" class="cbtn">Geri</button></div>
</div></div>
<div id="gm" class="hidden"><div class="gbox">
  <div class="ghead"><b id="gtitle">GM Paneli</b><span id="gstate"></span><button id="gclose" aria-label="Kapat">✕</button></div>
  <div id="gtools"><button data-g="lv1">Seviye +1</button><button data-g="lv10">Seviye +10</button><button data-g="lvset">Seviye seç</button><button data-g="gear">Ekipman giydir</button><button data-g="sp">Beceri puanı +20</button><button data-g="gold">Altın +100.000</button><button data-g="heal">Can doldur</button><button data-g="god">Ölümsüzlük</button><button data-g="fast">Hızlı koşu</button></div>
  <input id="gq" type="search" autocomplete="off">
  <div id="glist"></div>
</div></div>
<div id="chat" class="hidden"><input id="ctext" maxlength="120" placeholder="Mesajını yaz…" autocomplete="off" enterkeyhint="send"><button id="csend">Gönder</button><button id="cclose">✕</button></div>
<div id="death" class="hidden"><div><h2>Öldün</h2><button id="revive">Yeniden doğ</button></div></div>

<div id="create" class="hidden">
  <div class="cpanel">
    <label class="row">Ad <input id="cname" maxlength="12" value="Kahraman" autocomplete="off"></label>
    <div class="row"><span class="lab">Sınıf</span><button data-cls="战士">Savaşçı</button><button data-cls="法师">Büyücü</button><button data-cls="牧师">Kutsal Elçi</button></div>
    <div class="row"><span class="lab">Irk</span><button data-race="人类">İnsan</button><button data-race="精灵">Gece Elfi</button></div>
    <div class="row"><span class="lab">Cinsiyet</span><button data-sex="male">Erkek</button><button data-sex="fema">Kadın</button></div>
    <div class="row"><span class="lab">Yüz</span><div id="cfaces"></div></div>
    <button id="cstart">Oyuna başla</button><p id="cmsg" class="hint"></p>
  </div>
</div>

<script src="js/audio.js?v=11160954"></script>
<script src="js/assets.js?v=11160954"></script>
<script src="js/i18n.js?v=11160954"></script>
<script src="js/i18n_data.js?v=11160954"></script>
<script src="js/tr.js?v=11160954"></script>
<script src="js/tr_scenes.js?v=11160954"></script>
<script src="js/quests_gen.js?v=11160954"></script>
<script src="js/world.js?v=11160954"></script>
<script src="js/game.js?v=11160954"></script>
<script src="js/net.js?v=11160954"></script>
<script src="js/forms.js?v=11160954"></script>
<script src="js/win.js?v=11160954"></script>
<script src="js/ui.js?v=11160954"></script>
</body>
</html>
