<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Anrufen Online</title>
<link rel="stylesheet" href="style.css?v=11131245">
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">Yükleniyor…</div>
<div id="rotate" class="hidden"><div>Lütfen telefonunu yatay çevir</div></div>

<div id="panel" class="hidden">
  <div class="frame">
    <div class="phead"><span id="ptitle"></span><button id="pclose" aria-label="Kapat">✕</button></div>
    <div id="pbody"></div>
  </div>
</div>

<div id="dlg" class="hidden">
  <div class="dframe">
    <div id="dname"></div>
    <div id="dtext"></div>
    <div id="dbtns"></div>
  </div>
</div>

<div id="title" class="hidden"><div class="tbox"><img src="assets/ui/UIData_2067.png" alt="">
<button id="tcont">Devam Et</button><button id="tnew">Yeni Karakter</button><button id="tlang" class="small">English / Türkçe</button><p id="tinfo"></p><p class="ver">Sürüm 11131245</p></div></div>
<div id="death" class="hidden"><div><h2>Öldün</h2><button id="revive">Yeniden doğ</button></div></div>

<div id="create" class="hidden">
  <div class="cpanel">
    <label class="row">Ad <input id="cname" maxlength="12" value="Kahraman" autocomplete="off"></label>
    <div class="row"><span class="lab">Sınıf</span><button data-cls="战士">Savaşçı</button><button data-cls="法师">Büyücü</button><button data-cls="牧师">Kutsal Elçi</button></div>
    <div class="row"><span class="lab">Irk</span><button data-race="人类">İnsan</button><button data-race="精灵">Gece Elfi</button></div>
    <div class="row"><span class="lab">Cinsiyet</span><button data-sex="male">Erkek</button><button data-sex="fema">Kadın</button></div>
    <div class="row"><span class="lab">Yüz</span><div id="cfaces"></div></div>
    <button id="cstart">Oyuna başla</button>
  </div>
</div>

<script src="js/audio.js?v=11131245"></script>
<script src="js/assets.js?v=11131245"></script>
<script src="js/i18n.js?v=11131245"></script>
<script src="js/i18n_data.js?v=11131245"></script>
<script src="js/tr.js?v=11131245"></script>
<script src="js/world.js?v=11131245"></script>
<script src="js/game.js?v=11131245"></script>
<script src="js/forms.js?v=11131245"></script>
<script src="js/win.js?v=11131245"></script>
<script src="js/ui.js?v=11131245"></script>
</body>
</html>
