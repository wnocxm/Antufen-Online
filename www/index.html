<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Anrufen Online</title>
<link rel="stylesheet" href="style.css?v=11142350">
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">Yükleniyor…</div>
<div id="rotate" class="hidden"><div>Lütfen telefonunu yatay çevir</div></div>

<div id="panel" class="hidden">
  <div class="frame">
    <div class="phead"><span id="ptitle"></span><button id="pclose" aria-label="Kapat">✕</button></div>
    <div id="pbody"></div>
  </div>
</div>

<div id="dlg" class="hidden">
  <div class="dframe">
    <div id="dname"></div>
    <div id="dtext"></div>
    <div id="dbtns"></div>
  </div>
</div>

<!-- Giriş ekranı: orijinal AnrufenCoverUI formları (10001 Oyuna Gir, 10002 Kullanıcı Girişi). 360x360 mantıksal alan, ekrana ölçeklenir. -->
<div id="title" class="cover hidden"><div class="cv">
  <div class="cbg"></div><div class="ctit">Oyuna Gir</div>
  <div class="cmenu" id="tmenu">
    <button id="tcont">Devam Et</button><button id="tnew">Yeni Karakter</button><button id="tonline">Çevrimiçi Oyna</button><button id="tlang">English / Türkçe</button>
  </div>
  <p id="tinfo" class="cinfo"></p>
  <div class="cbar"><button class="sk l" id="tok">Seç</button><span class="ver">Sürüm 11142350</span></div>
</div></div>
<div id="online" class="cover hidden"><div class="cv">
  <div class="cbg"></div><div class="ctit" id="otit">Kullanıcı Girişi</div>
  <div id="ologin" class="cform">
    <label><span>Sunucu</span><input id="ourl" placeholder="https://…" autocomplete="url" inputmode="url"></label>
    <label><span>Kullanıcı adı</span><input id="ouser" maxlength="24" autocomplete="username" autocapitalize="off"></label>
    <label><span>Şifre</span><input id="opass" type="password" maxlength="100" autocomplete="current-password"></label>
    <div class="cmenu small"><button id="ogo">Giriş</button><button id="oreg">Hesap Aç</button></div>
  </div>
  <div id="ochars" class="hidden"><div id="olist" class="cmenu"></div>
    <div class="cmenu small"><button id="onew">Yeni Karakter</button><button id="oout">Çıkış yap</button></div>
  </div>
  <p id="omsg" class="cinfo"></p>
  <div class="cbar"><button class="sk l" id="ook">Seç</button><button class="sk r" id="oback">Geri</button></div>
</div></div>
<div id="chat" class="hidden"><input id="ctext" maxlength="120" placeholder="Mesajını yaz…" autocomplete="off" enterkeyhint="send"><button id="csend">Gönder</button><button id="cclose">✕</button></div>
<div id="death" class="hidden"><div><h2>Öldün</h2><button id="revive">Yeniden doğ</button></div></div>

<div id="create" class="hidden">
  <div class="cpanel">
    <label class="row">Ad <input id="cname" maxlength="12" value="Kahraman" autocomplete="off"></label>
    <div class="row"><span class="lab">Sınıf</span><button data-cls="战士">Savaşçı</button><button data-cls="法师">Büyücü</button><button data-cls="牧师">Kutsal Elçi</button></div>
    <div class="row"><span class="lab">Irk</span><button data-race="人类">İnsan</button><button data-race="精灵">Gece Elfi</button></div>
    <div class="row"><span class="lab">Cinsiyet</span><button data-sex="male">Erkek</button><button data-sex="fema">Kadın</button></div>
    <div class="row"><span class="lab">Yüz</span><div id="cfaces"></div></div>
    <button id="cstart">Oyuna başla</button><p id="cmsg" class="hint"></p>
  </div>
</div>

<script src="js/audio.js?v=11142350"></script>
<script src="js/assets.js?v=11142350"></script>
<script src="js/i18n.js?v=11142350"></script>
<script src="js/i18n_data.js?v=11142350"></script>
<script src="js/tr.js?v=11142350"></script>
<script src="js/world.js?v=11142350"></script>
<script src="js/game.js?v=11142350"></script>
<script src="js/net.js?v=11142350"></script>
<script src="js/forms.js?v=11142350"></script>
<script src="js/win.js?v=11142350"></script>
<script src="js/ui.js?v=11142350"></script>
</body>
</html>
